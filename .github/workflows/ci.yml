name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Quality and Test Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history is required to prove a release tag is on main.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check Formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Verify Dependencies
        run: go mod verify

      - name: Verify Tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD || {
            echo "Error: release tag must point to a commit on main."
            exit 1
          }

      - name: Static Analysis (go vet)
        run: go vet ./...

      - name: Run Tests
        run: go test -v -race ./...
